name: Dependency Audit Diagnostics

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "requirements*.txt"
      - ".github/workflows/dependency-audit-diagnostics.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt -r requirements-ci.txt
      - name: Run audit and save complete output
        id: audit
        continue-on-error: true
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "pip-audit.stdout.log"
          $stderr = Join-Path $env:RUNNER_TEMP "pip-audit.stderr.log"
          $process = Start-Process -FilePath "python" `
            -ArgumentList @("-m", "pip_audit", "--strict", "--progress-spinner", "off", "-r", "requirements-build.txt") `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr `
            -Wait `
            -PassThru
          Set-Content -Path (Join-Path $env:RUNNER_TEMP "pip-audit.exit-code.txt") -Value $process.ExitCode
          if ($process.ExitCode -ne 0) { throw "pip-audit failed with exit code $($process.ExitCode)" }
      - name: Upload audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Dependency-Audit-Diagnostics
          path: |
            ${{ runner.temp }}/pip-audit.stdout.log
            ${{ runner.temp }}/pip-audit.stderr.log
            ${{ runner.temp }}/pip-audit.exit-code.txt
          if-no-files-found: error
          retention-days: 7
      - name: Preserve audit failure
        if: steps.audit.outcome == 'failure'
        run: throw "Dependency audit failed; diagnostics artifact was uploaded."
