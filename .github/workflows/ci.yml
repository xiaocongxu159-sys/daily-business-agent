name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - name: Compile
        run: python -m compileall -q agent tests scripts
      - name: Unit and TLS bridge tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Public boundary scan
        run: python scripts/public_boundary_scan.py

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-test.lock
      - name: Install Windows test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - name: Run package tests on Windows
        shell: pwsh
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: .\packaging\build_installer.ps1

      - name: Install candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw "VERSION").Trim()
          $setup = (Resolve-Path "release\DailyBusinessAgent-Setup-$version.exe").Path
          $installDir = Join-Path $env:RUNNER_TEMP "DailyBusinessAgentApp"
          $dataDir = Join-Path $env:RUNNER_TEMP "DailyBusinessAgentData"
          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content (Join-Path $dataDir "preserve-me.txt") "keep"
          "DBA_INSTALL_DIR=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "DBA_DATA_DIR=$dataDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $install = Start-Process $setup -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART",
            "/SP-",
            "/DIR=$installDir",
            "/TASKS=autostart"
          ) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "installer failed: $($install.ExitCode)" }
          $exe = Join-Path $installDir "DailyBusinessAgent.exe"
          if (-not (Test-Path $exe)) { throw "installed executable missing" }
          Write-Host "PASS: candidate installed"

      - name: Verify startup shortcut
        shell: pwsh
        run: |
          $startup = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Startup\每日经营数据本地助手 后台同步.lnk"
          if (-not (Test-Path $startup)) { throw "startup shortcut missing" }
          Write-Host "PASS: startup shortcut exists"

      - name: Locate drag-drop import shortcut
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $name = "导入每日经营连接包.lnk"
          $desktopCandidates = @(
            [Environment]::GetFolderPath([Environment+SpecialFolder]::DesktopDirectory),
            (Join-Path $env:USERPROFILE "Desktop"),
            (Join-Path $env:PUBLIC "Desktop")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

          $candidatePaths = @($desktopCandidates | ForEach-Object { Join-Path $_ $name })
          foreach ($candidate in $candidatePaths) {
            Write-Host "Checked desktop shortcut path exists=$([bool](Test-Path $candidate)): $candidate"
          }
          $importShortcut = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $importShortcut) { throw "desktop import shortcut missing" }
          "DBA_IMPORT_SHORTCUT=$importShortcut" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PASS: drag-drop import shortcut located"

      - name: Verify drag-drop import shortcut target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:DBA_INSTALL_DIR "DailyBusinessAgent.exe"
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($env:DBA_IMPORT_SHORTCUT)
          Write-Host "Import shortcut target filename: $([IO.Path]::GetFileName($shortcut.TargetPath))"
          Write-Host "Import shortcut has fixed arguments: $(-not [string]::IsNullOrWhiteSpace($shortcut.Arguments))"
          if ([IO.Path]::GetFullPath($shortcut.TargetPath) -ne [IO.Path]::GetFullPath($exe)) {
            throw "import shortcut target is incorrect"
          }
          if (-not [string]::IsNullOrWhiteSpace($shortcut.Arguments)) {
            throw "import shortcut must accept a dropped file without fixed arguments"
          }
          Write-Host "PASS: drag-drop import shortcut target verified"

      - name: Verify .dba file association
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path $env:DBA_INSTALL_DIR "DailyBusinessAgent.exe"
          $extensionKey = Get-Item "HKCU:\Software\Classes\.dba"
          $association = [string]$extensionKey.GetValue("")
          Write-Host "Association ProgID: $association"
          if ($association -ne "DailyBusinessAgent.ConnectionPackage") {
            throw ".dba file association missing"
          }
          $commandKey = Get-Item "HKCU:\Software\Classes\DailyBusinessAgent.ConnectionPackage\shell\open\command"
          $openCommand = [string]$commandKey.GetValue("")
          Write-Host "Open command contains executable: $($openCommand.Contains($exe))"
          Write-Host "Open command contains file placeholder: $($openCommand.Contains('%1'))"
          if (-not $openCommand.Contains($exe) -or -not $openCommand.Contains('%1')) {
            throw ".dba open command is incorrect"
          }
          Write-Host "PASS: .dba association verified"

      - name: Verify loopback UI and hidden technical fields
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $version = (Get-Content -Raw "VERSION").Trim()
          $exe = Join-Path $env:DBA_INSTALL_DIR "DailyBusinessAgent.exe"
          $agent = Start-Process $exe -ArgumentList @("--no-browser","--data-root",$env:DBA_DATA_DIR) -PassThru
          try {
            $health = $null
            foreach ($attempt in 1..60) {
              try {
                $health = Invoke-RestMethod "http://127.0.0.1:8766/health" -TimeoutSec 2
                if ($health.status -eq "ok") { break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $health -or $health.bind -ne "127.0.0.1:8766" -or $health.version -ne $version) {
              throw "loopback health failed"
            }
            $page = Invoke-WebRequest "http://127.0.0.1:8766/lingxing" -UseBasicParsing -TimeoutSec 5
            if ($page.Content -notmatch 'id="package-ready"') { throw "single-file package state missing" }
            if ($page.Content -match 'type="file"') { throw "browser file picker must not ship" }
            if ($page.Content -match '\.sha256') { throw "sidecar checksum instructions must not ship" }
            if ($page.Content -match 'id="proxy-url"') { throw "manual proxy input must not ship" }
            $listeners = Get-NetTCPConnection -State Listen -LocalPort 8766
            if ($listeners.LocalAddress | Where-Object { $_ -notin @("127.0.0.1","::1") }) {
              throw "non-loopback listener detected"
            }
            Write-Host "PASS: loopback UI and hidden technical fields verified"
          } finally {
            Stop-Process -Id $agent.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Uninstall and verify cleanup boundaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $uninstaller = Join-Path $env:DBA_INSTALL_DIR "unins000.exe"
          $uninstall = Start-Process $uninstaller -ArgumentList @(
            "/VERYSILENT",
            "/SUPPRESSMSGBOXES",
            "/NORESTART"
          ) -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "uninstaller failed" }
          if (-not (Test-Path (Join-Path $env:DBA_DATA_DIR "preserve-me.txt"))) {
            throw "user data deleted"
          }
          if (Test-Path "HKCU:\Software\Classes\DailyBusinessAgent.ConnectionPackage") {
            throw "file association was not removed by uninstall"
          }
          Write-Host "PASS: uninstall preserved user data and removed association"

      - uses: actions/upload-artifact@v4
        with:
          name: DailyBusinessAgent-Windows-${{ github.sha }}
          path: |
            release/DailyBusinessAgent-Setup-*.exe
            release/DailyBusinessAgent-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
