name: CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.lock
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - name: Compile
        run: python -m compileall -q agent tests scripts
      - name: Unit and TLS bridge tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Public boundary scan
        run: python scripts/public_boundary_scan.py

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-build.lock
            requirements-test.lock
      - name: Install Windows test dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements-test.lock
      - name: Run package tests on Windows
        shell: pwsh
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup --no-progress -y
          }
      - name: Build installer
        shell: pwsh
        run: .\packaging\build_installer.ps1
      - name: Verify installer, one-file import UX and uninstall boundaries
        shell: pwsh
        run: .\scripts\verify_windows_installer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: DailyBusinessAgent-Windows-${{ github.sha }}
          path: |
            release/DailyBusinessAgent-Setup-*.exe
            release/DailyBusinessAgent-Setup-*.exe.sha256
          if-no-files-found: error
          retention-days: 14
