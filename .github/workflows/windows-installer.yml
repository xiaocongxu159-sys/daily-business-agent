name: Windows Installer

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "agent/**"
      - "config/**"
      - "packaging/**"
      - "scripts/**"
      - "src/**"
      - "tests/**"
      - "requirements*.txt"
      - "VERSION"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/windows-installer.yml"
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-install-upgrade-uninstall:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-ci.txt
      - name: Read candidate version
        id: version
        run: |
          $version = (Get-Content -Raw "VERSION").Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid VERSION" }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Ensure Inno Setup
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          if (-not ($candidates | Where-Object { Test-Path $_ } | Select-Object -First 1)) {
            choco install innosetup --no-progress -y
          }
      - name: Install pinned dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt -r requirements-ci.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit pinned runtime and build environment
        run: python -m pip_audit --strict --progress-spinner off -r requirements-build.txt
      - name: Build unified installer
        run: .\packaging\build_installer.ps1
      - name: Verify install, frozen SDK, real analysis, clean upgrade, association and data retention
        timeout-minutes: 10
        run: |
          $diagnostic = Join-Path $env:RUNNER_TEMP "windows-verification-error.txt"
          Remove-Item -LiteralPath $diagnostic -Force -ErrorAction SilentlyContinue
          $sameOriginHeaders = @{
            Origin = "http://127.0.0.1:8766"
            Referer = "http://127.0.0.1:8766/"
            "Sec-Fetch-Site" = "same-origin"
          }
          $PSDefaultParameterValues['Invoke-RestMethod:Headers'] = $sameOriginHeaders
          $PSDefaultParameterValues['Invoke-WebRequest:Headers'] = $sameOriginHeaders
          try {
            .\scripts\verify_windows_installer.ps1
          } catch {
            $_ | Format-List * -Force | Out-String | Set-Content -LiteralPath $diagnostic -Encoding utf8
            throw
          } finally {
            $PSDefaultParameterValues.Remove('Invoke-RestMethod:Headers')
            $PSDefaultParameterValues.Remove('Invoke-WebRequest:Headers')
          }
      - name: Upload Windows verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-verification-diagnostic-${{ github.sha }}
          path: |
            ${{ runner.temp }}/windows-verification-error.txt
            ${{ runner.temp }}/http-analysis-*/**
            ${{ runner.temp }}/DailyBusinessAgentData/jobs/**
            ${{ runner.temp }}/daily-business-agent-*.log
          if-no-files-found: warn
          retention-days: 7
      - name: Generate dependency license report
        run: |
          python -m piplicenses --format=markdown --with-urls --output-file=release/THIRD_PARTY_LICENSES.generated.md
      - name: Upload candidate installer
        uses: actions/upload-artifact@v4
        with:
          name: DailyBusinessAgent-Windows-${{ steps.version.outputs.value }}-${{ github.sha }}
          path: |
            release/DailyBusinessAgent-Setup-${{ steps.version.outputs.value }}.exe
            release/DailyBusinessAgent-Setup-${{ steps.version.outputs.value }}.exe.sha256
            release/THIRD_PARTY_LICENSES.generated.md
          if-no-files-found: error
          retention-days: 14
