name: Public Security Core

on:
  pull_request:
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements*.txt"
      - ".github/workflows/security-core.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements*.txt"
      - ".github/workflows/security-core.yml"

permissions:
  contents: read

jobs:
  security-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          pytest fastapi uvicorn python-multipart httpx
      - name: Compile public modules
        run: python -m compileall -q agent src
      - name: Reject private identifiers and key material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'CTJFyrdian|/home/ubuntu|amazon-keyword-rank-monitor-dev|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|9226' agent src config docs tests; then
            echo "A forbidden private identifier or private-key marker was found."
            exit 1
          fi
      - name: Check Lingxing static file
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_static_file_exists
      - name: Check base Agent construction
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_base_agent_app_builds
      - name: Check Lingxing service construction
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_service_builds
      - name: Check Lingxing attachment
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_attach_lingxing_returns_same_app
      - name: Check Lingxing route registration
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_route_is_registered
      - name: Check Lingxing route function
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_route_endpoint_returns_html
      - name: Check Lingxing HTTP route status
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_route_returns_success
      - name: Check Lingxing page title
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_page_contains_title
      - name: Check Lingxing external resources
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_page_has_no_external_resources
      - name: Check Lingxing credential fields
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_page_does_not_embed_credentials
      - name: Check Lingxing security headers
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_lingxing_page_has_security_headers
      - name: Check Lingxing configure sync and disconnect
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_configure_status_sync_and_disconnect_never_return_secrets
      - name: Check Lingxing cross-site blocking
        run: python -m pytest -q tests/test_lingxing_local_page.py::test_cross_site_request_cannot_configure_lingxing
      - name: Run remaining public tests
        run: >-
          python -m pytest -q tests
          --ignore=tests/test_lingxing_local_page.py
