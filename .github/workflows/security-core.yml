name: Public Security Core

on:
  pull_request:
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/security-core.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/security-core.yml"

permissions:
  contents: read

jobs:
  security-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-ci.txt
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt -r requirements-ci.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile public modules
        run: python -m compileall -q agent src tests
      - name: Enforce public repository boundary
        run: python scripts/public_boundary_scan.py
      - name: Run complete unified Agent test suite
        run: python -B -m pytest -q
