name: Public Security Core

on:
  pull_request:
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "scripts/**"
      - "docs/**"
      - "requirements*.txt"
      - "VERSION"
      - ".github/workflows/security-core.yml"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-core:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-ci.txt
      - name: Install pinned runtime and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt -r requirements-ci.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Compile public modules
        run: python -m compileall -q agent src tests
      - name: Enforce public repository boundary
        run: python scripts/public_boundary_scan.py
      - name: Test single-file connection package and TLS bridge
        run: python -B -m pytest -q tests/test_connection_package.py tests/test_tls_bridge.py
      - name: Test Lingxing page and encrypted storage boundaries
        run: python -B -m pytest -q tests/test_lingxing_local_page.py tests/test_lingxing_admin_ux.py tests/test_public_security_core.py
      - name: Test Lingxing business data contract
        run: python -B -m pytest -q tests/test_lingxing_business_contract.py
      - name: Test Lingxing sync foundation, local dashboard and recovery
        run: >-
          python -B -m pytest -q
          tests/test_lingxing_sync_foundation.py
          tests/test_lingxing_available_sync.py
          tests/test_lingxing_dashboard_bridge.py
          tests/test_lingxing_dashboard_scale.py
          tests/test_lingxing_dashboard_recovery.py
          tests/test_dashboard_operator_cleanup.py
      - name: Test privacy-safe Lingxing read-only probe
        run: |
          set -o pipefail
          python -B -m pytest -vv \
            tests/test_lingxing_probe.py \
            tests/test_lingxing_probe_diagnostics.py \
            tests/test_lingxing_controlled_probe.py \
            2>&1 | tee probe-test-output.txt
      - name: Upload read-only probe test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: read-only-probe-test-diagnostic-${{ github.sha }}
          path: probe-test-output.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Test Agent HTTP, job storage and request boundaries
        run: python -B -m pytest -q tests/test_agent_http_security.py tests/test_job_store_security.py tests/test_local_engine_request_security.py
      - name: Test report loaders, identity, merge and plans
        run: python -B -m pytest -q tests/test_public_report_loaders.py tests/test_public_identity_and_mapping.py tests/test_public_data_merger.py tests/test_public_erp_inventory_plan.py
      - name: Test complete local engine and rich dashboard output
        run: python -B -m pytest -q tests/test_public_local_engine_e2e.py tests/test_rich_dashboard.py
      - name: Test Windows packaging and frozen runtime contracts
        run: python -B -m pytest -q tests/test_packaging_contract.py tests/test_frozen_runtime.py
