name: Public Security Core

on:
  pull_request:
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements*.txt"
      - ".github/workflows/security-core.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "src/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements*.txt"
      - ".github/workflows/security-core.yml"

permissions:
  contents: read

jobs:
  security-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r requirements.txt
          pytest fastapi uvicorn python-multipart httpx
      - name: Compile public modules
        run: python -m compileall -q agent src
      - name: Reject private identifiers and key material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'CTJFyrdian|/home/ubuntu|amazon-keyword-rank-monitor-dev|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|9226' agent src config docs tests; then
            echo "A forbidden private identifier or private-key marker was found."
            exit 1
          fi
      - name: Check Lingxing page resources
        run: >-
          python -m pytest -q
          tests/test_lingxing_local_page.py::test_lingxing_page_has_no_external_resources_or_saved_values
      - name: Check Lingxing configure sync and disconnect
        run: >-
          python -m pytest -q
          tests/test_lingxing_local_page.py::test_configure_status_sync_and_disconnect_never_return_secrets
      - name: Check Lingxing cross-site blocking
        run: >-
          python -m pytest -q
          tests/test_lingxing_local_page.py::test_cross_site_request_cannot_configure_lingxing
      - name: Run remaining public tests
        run: >-
          python -m pytest -q tests
          --ignore=tests/test_lingxing_local_page.py
