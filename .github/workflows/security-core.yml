name: Public Security Core

on:
  pull_request:
    paths:
      - "agent/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements*.txt"
      - ".github/workflows/security-core.yml"
  push:
    branches: [main]
    paths:
      - "agent/**"
      - "config/**"
      - "tests/**"
      - "docs/**"
      - "requirements*.txt"
      - ".github/workflows/security-core.yml"

permissions:
  contents: read

jobs:
  security-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          pytest fastapi uvicorn python-multipart openpyxl httpx
      - name: Compile public modules
        run: python -m compileall -q agent
      - name: Reject private identifiers and key material
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'CTJFyrdian|/home/ubuntu|amazon-keyword-rank-monitor-dev|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|9226' agent config docs tests; then
            echo "A forbidden private identifier or private-key marker was found."
            exit 1
          fi
      - name: Run all current public tests
        run: python -m pytest -q tests
